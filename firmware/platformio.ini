; PlatformIO build (optional - the Arduino IDE works too). Builds AgentDot/AgentDot.ino directly, no renaming.
;   cd firmware && pio run -e xiao_esp32c3 -t upload && pio device monitor
[platformio]
src_dir = AgentDot
default_envs = xiao_esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3

[env:esp32c3_supermini]
board = esp32-c3-devkitm-1

[env:esp32s3_supermini]
board = esp32-s3-devkitc-1
